<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Cyan/Sky Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Speed Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Neon Border Glow -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Stylized Mechanical Keycap Base -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#161f30" stroke="#334155" stroke-width="6" />
  <rect x="112" y="112" width="288" height="272" rx="36" fill="#0e1422" stroke="#1e293b" stroke-width="3" />

  <!-- Glow effect under the Letter T -->
  <path d="M160 176 H352 V224 H284 V344 H228 V224 H160 Z" fill="#38bdf8" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Main Letter T (TypeMaster) -->
  <path d="M160 176 H352 V224 H284 V344 H228 V224 H160 Z" fill="url(#accentGrad)" />

  <!-- Lightning Bolt (Typing Speed & Reflexes) -->
  <polygon points="328,144 264,256 312,256 248,368 360,232 304,232" fill="url(#boltGrad)" filter="url(#neonGlow)" />
  <polygon points="328,144 264,256 312,256 248,368 360,232 304,232" fill="#fef08a" opacity="0.9" />

  <!-- Dot Accents (Keyboard Status LEDs) -->
  <circle cx="140" cy="140" r="8" fill="#4ade80" />
  <circle cx="166" cy="140" r="8" fill="#38bdf8" />
  <circle cx="192" cy="140" r="8" fill="#f87171" />
</svg>